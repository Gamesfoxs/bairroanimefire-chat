<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0a2e" />
  <meta name="description" content="Bairro Anime Fire — chat em tempo real com seus amigos" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Bairro Anime Fire</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Auth -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">🔥</div>
      <h1>Bairro Anime Fire</h1>
      <p class="auth-sub">Chat em tempo real com a galera</p>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="login">Entrar</button>
        <button type="button" class="auth-tab" data-tab="register">Criar conta</button>
      </div>
      <form id="auth-form">
        <label>
          Usuário
          <input id="auth-username" name="username" autocomplete="username" required minlength="3" maxlength="20" placeholder="seu_nick" />
        </label>
        <label id="display-name-wrap" class="hidden">
          Nome de exibição
          <input id="auth-display" name="displayName" maxlength="32" placeholder="Como quer aparecer" />
        </label>
        <label>
          Senha
          <input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="4" placeholder="••••••••" />
        </label>
        <p id="auth-error" class="auth-error" hidden></p>
        <button type="submit" class="btn-primary" id="auth-submit">Entrar</button>
      </form>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="app hidden">
    <!-- Server rail -->
    <aside class="server-rail" id="server-rail" aria-label="Servidores">
      <button class="server-btn home active" id="btn-home" title="Início / Amigos" data-view="home">🏠</button>
      <div class="rail-sep"></div>
      <div id="server-list"></div>
      <button class="server-btn add" id="btn-add-server" title="Criar servidor">+</button>
    </aside>

    <!-- Channels / friends sidebar -->
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header" id="sidebar-header">
        <h2 id="sidebar-title">Amigos</h2>
      </header>
      <div class="sidebar-body" id="sidebar-body"></div>
      <footer class="user-panel" id="user-panel">
        <div class="avatar" id="me-avatar">?</div>
        <div class="user-meta">
          <strong id="me-name">—</strong>
          <span id="me-status">Online</span>
        </div>
        <button type="button" class="icon-btn" id="btn-logout" title="Sair">⏻</button>
      </footer>
    </aside>

    <!-- Main chat -->
    <main class="chat-main">
      <header class="chat-header">
        <button type="button" class="icon-btn mobile-only" id="btn-toggle-sidebar" aria-label="Menu">☰</button>
        <span class="channel-hash" id="chat-hash">#</span>
        <h2 id="chat-title">Bem-vindo</h2>
        <button type="button" class="icon-btn mobile-only" id="btn-toggle-members" aria-label="Membros">👥</button>
      </header>
      <div class="messages" id="messages" role="log" aria-live="polite"></div>
      <div class="typing" id="typing" hidden></div>
      <form class="composer" id="composer" hidden>
        <input id="composer-input" type="text" maxlength="2000" autocomplete="off" placeholder="Mensagem..." />
        <button type="submit" class="btn-send" aria-label="Enviar">➤</button>
      </form>
      <div id="home-view" class="home-view">
        <h2>🔥 Bem-vindo ao Bairro Anime Fire</h2>
        <p>Escolha um canal à esquerda ou abra uma conversa com um amigo.</p>
        <div class="home-cards">
          <div class="home-card">
            <h3>Adicionar amigo</h3>
            <form id="add-friend-form" class="inline-form">
              <input id="friend-username" placeholder="nome_de_usuario" maxlength="20" required />
              <button type="submit" class="btn-primary">Adicionar</button>
            </form>
            <p id="friend-msg" class="hint"></p>
          </div>
          <div class="home-card">
            <h3>Pedidos pendentes</h3>
            <ul id="pending-list" class="plain-list"></ul>
          </div>
          <div class="home-card">
            <h3>Seus amigos</h3>
            <ul id="friends-list" class="plain-list"></ul>
          </div>
        </div>
      </div>
    </main>

    <!-- Members -->
    <aside class="members" id="members-panel" aria-label="Membros">
      <h3>Membros — <span id="member-count">0</span></h3>
      <ul id="members-list"></ul>
    </aside>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
